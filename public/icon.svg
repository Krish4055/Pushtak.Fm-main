<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2562F" />
      <stop offset="100%" stop-color="#9C3A18" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF6EF" />
      <stop offset="100%" stop-color="#E8DFD0" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Book Spine & Pages in warm cream -->
  <path d="M128 360 C 180 340, 230 350, 256 370 C 282 350, 332 340, 384 360 L 384 170 C 332 150, 282 160, 256 180 C 230 160, 180 150, 128 170 Z" fill="#FAF6EF" fill-opacity="0.95" />
  
  <!-- Center Book Spine Line -->
  <line x1="256" y1="180" x2="256" y2="370" stroke="#2B2118" stroke-width="5" stroke-linecap="round" />

  <!-- Acoustic Equalizer Waves above the Book -->
  <rect x="180" y="210" width="12" height="50" rx="6" fill="#C2562F" />
  <rect x="205" y="185" width="12" height="90" rx="6" fill="#C2562F" />
  <rect x="230" y="165" width="12" height="130" rx="6" fill="#C2562F" />
  <rect x="270" y="165" width="12" height="130" rx="6" fill="#C2562F" />
  <rect x="295" y="185" width="12" height="90" rx="6" fill="#C2562F" />
  <rect x="320" y="210" width="12" height="50" rx="6" fill="#C2562F" />
</svg>
